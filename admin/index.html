<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOOD Admin — Control Panel</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Auth / setup screen -->
<div id="authScreen" class="auth">
  <div class="card">
    <div class="brand">MOOD<span>Admin</span></div>
    <div id="authBody"></div>
  </div>
</div>

<!-- Main app -->
<div id="app" style="display:none">
  <aside>
    <div class="brand">MOOD<span>Admin</span></div>
    <div class="live"><i></i>System Online</div>
    <nav>
      <button class="nl active" data-p="overview" data-perm="overview">Dashboard</button>
      <button class="nl" data-p="products" data-perm="products">Products</button>
      <button class="nl" data-p="categories" data-perm="categories">Categories</button>
      <button class="nl" data-p="orders" data-perm="orders">Orders</button>
      <button class="nl" data-p="customers" data-perm="customers">Customers</button>
      <button class="nl" data-p="promos" data-perm="promos">Promo Codes</button>
      <button class="nl" data-p="settings" data-perm="settings">Settings</button>
      <button class="nl" data-p="images" data-perm="settings">Images</button>
      <button class="nl" data-p="notifications" data-perm="notifications">Notifications</button>
      <button class="nl" data-p="announcements" data-perm="announcements">Announcements</button>
      <button class="nl" data-p="reports" data-perm="reports">Reports</button>
      <button class="nl" data-p="reviews" data-perm="reviews">Reviews</button>
      <button class="nl" data-p="reservations" data-perm="reservations">Reservations</button>
      <button class="nl" data-p="giftcards" data-perm="giftcards">Gift Cards</button>
      <button class="nl" data-p="payouts" data-perm="payouts">Withdrawals</button>
      <button class="nl" data-p="paypack" data-perm="paypack">Payments</button>
      <button class="nl" data-p="admins" data-super="1">Team &amp; Admins</button>
    </nav>
    <div class="user">
      <div><b id="aName"></b><span id="aEmail"></span><span id="aRole" class="role-badge"></span></div>
      <button onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="main">
    <header>
      <button class="burger" id="burger" onclick="adminNav()" aria-label="Menu"><span></span><span></span><span></span></button>
      <h1 id="title">Dashboard</h1>
      <div class="r">
        <input id="gSearch" placeholder="Search products, orders…" oninput="gSearch(this.value)">
        <span class="bell" onclick="switchPanel('notifications')">🔔<i id="bellDot"></i></span>
      </div>
    </header>
    <main id="pan"></main>
  </div>
</div>

<!-- Mobile nav overlay -->
<div class="nav-ovl" id="navOvl" onclick="adminNavClose()"></div>

<!-- Product modal -->
<div class="ovl" id="prodOvl" onclick="closeModal('prodOvl')"></div>
<div class="modal" id="prodModal">
  <div class="mh"><b id="prodTitle">Add Product</b><button class="x" onclick="closeModal('prodOvl')">&times;</button></div>
  <div class="mb">
    <input type="hidden" id="pId">
    <div class="fg"><label>Name *</label><input id="pName"></div>
    <div class="fg2">
      <div><label>Category *</label><select id="pCat"></select></div>
      <div><label>Price ($) *</label><input id="pPrice" type="number" step="0.5" min="0"></div>
    </div>
    <div class="fg"><label>Description *</label><textarea id="pDesc" rows="2"></textarea></div>
    <div class="fg2">
      <div><label>Emoji</label><input id="pEmoji" maxlength="2"></div>
      <div><label>Image URL</label><input id="pImg" placeholder="https://…"></div>
    </div>
    <div class="fg2">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:.8rem;color:var(--cream)"><input type="checkbox" id="pAvail" checked> Available</label>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:.8rem;color:var(--cream)"><input type="checkbox" id="pFeat"> Featured</label>
      <label class="upl"><input type="file" accept="image/*" onchange="upImg(event)"> Upload image</label>
    </div>
    <div class="err" id="pErr"></div>
  </div>
  <div class="mf"><button class="ghost" onclick="closeModal('prodOvl')">Cancel</button><button class="gold" onclick="saveProd()">Save</button></div>
</div>

<!-- Category modal -->
<div class="ovl" id="catOvl" onclick="closeModal('catOvl')"></div>
<div class="modal" id="catModal">
  <div class="mh"><b>Add Category</b><button class="x" onclick="closeModal('catOvl')">&times;</button></div>
  <div class="mb">
    <div class="fg"><label id="cNameLbl">Name *</label><input id="cName"></div>
    <div class="fg" id="cField2"><label>Image URL</label><input id="cImg"></div>
    <div class="fg" id="cField3"><label>Service</label><select id="cSvc"><option value="coffee">Coffee</option><option value="bakery">Bakery</option></select></div>
    <div class="err" id="cErr"></div>
  </div>
  <div class="mf"><button class="ghost" onclick="closeModal('catOvl')">Cancel</button><button class="gold" onclick="saveCat()">Save</button></div>
</div>

<!-- Admin (team) modal -->
<div class="ovl" id="admOvl" onclick="closeModal('admOvl')"></div>
<div class="modal" id="admModal">
  <div class="mh"><b id="admTitle">Add Admin</b><button class="x" onclick="closeModal('admOvl')">&times;</button></div>
  <div class="mb">
    <input type="hidden" id="admId">
    <div class="fg2">
      <div><label>Name *</label><input id="admName"></div>
      <div><label>Email *</label><input id="admMail" type="email"></div>
    </div>
    <div class="fg2">
      <div><label>Password <span id="admPassLbl">*</span></label><input id="admPass" type="password" placeholder="Min 6 characters"></div>
      <div><label>Role</label><select id="admRole" onchange="admRoleChg()"><option value="staff">Staff</option><option value="superadmin">Super Admin</option></select></div>
    </div>
    <div class="fg"><label>Permissions</label><div id="admPerms" class="permgrid"></div></div>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:.8rem"><input type="checkbox" id="admStat" checked> Account active</label>
    <div class="err" id="admErr"></div>
  </div>
  <div class="mf"><button class="ghost" onclick="closeModal('admOvl')">Cancel</button><button class="gold" onclick="saveAdmin()">Save Admin</button></div>
</div>

<!-- Confirm -->
<div class="ovl" id="cfOvl"></div>
<div class="modal sm" id="cfModal">
  <div class="mh"><b id="cfT">Confirm</b></div>
  <div class="mb"><p id="cfM"></p></div>
  <div class="mf"><button class="ghost" onclick="closeModal('cfOvl')">Cancel</button><button class="danger" onclick="doCf()">Confirm</button></div>
</div>

<!-- Gift card modal -->
<div class="ovl" id="gcOvl" onclick="closeModal('gcOvl')"></div>
<div class="modal" id="gcModal">
  <div class="mh"><b>Create Gift Card</b><button class="x" onclick="closeModal('gcOvl')">&times;</button></div>
  <div class="mb">
    <div class="fg"><label>Buyer name *</label><input id="gcName"></div>
    <div class="fg2">
      <div><label>Buyer email *</label><input id="gcMail" type="email"></div>
      <div><label>Value ($) *</label><input id="gcAmt" type="number" min="1" max="500" value="20"></div>
    </div>
    <div class="err" id="gcErr"></div>
  </div>
  <div class="mf"><button class="ghost" onclick="closeModal('gcOvl')">Cancel</button><button class="gold" onclick="saveGc()">Create</button></div>
</div>

<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
